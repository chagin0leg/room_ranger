name: Update ICS files

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-calendars:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install, Login and Connect to VPN (background)
        run: |
          curl -fsSL https://raw.githubusercontent.com/AdguardTeam/AdGuardVPNCLI/master/scripts/release/install.sh | sh -s -- -v -a y
          adguardvpn-cli login --username ${{ secrets.ADGUARD_VPN_USERNAME }} --password ${{ secrets.ADGUARD_VPN_PASSWORD }}
          adguardvpn-cli connect -y -6 > /dev/null 2>&1 &
          echo $! > vpn.pid

      - name: Download ICS files
        run: bash download_ics.sh

      - name: Disconnect VPN
        run: |
          kill $(cat vpn.pid) || true
          adguardvpn-cli disconnect || true

      - name: Build HTML calendar data
        run: node scripts/build_data.mjs

      - name: Commit HTML calendar data
        id: html_commit
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          if git diff --quiet html/assets/data.json; then
            echo "html_changed=false" >> $GITHUB_OUTPUT
            echo "No changes in HTML calendar data"
          else
            git add html/assets/data.json
            git commit -m "Update HTML calendar data"
            git push origin main
            echo "html_changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy HTML to gh-pages-2
        if: steps.html_commit.outputs.html_changed == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./html
          publish_branch: gh-pages-2

      - name: Checkout gh-pages for Flutter
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-flutter

      - name: Update Flutter ICS on gh-pages
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          mkdir -p gh-pages-flutter/assets/assets/data
          cp assets/data/*.ics gh-pages-flutter/assets/assets/data/
          cd gh-pages-flutter
          if git diff --quiet; then
            echo "No changes in Flutter ICS files"
          else
            git add assets/assets/data/*.ics
            git commit -m "Update ICS files"
            git push origin gh-pages
          fi
